name: Pull Request

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          tools: phpcs

      - name: Lint
        run: phpcs

  test:
    strategy:
      matrix:
        operating-system: [ubuntu-latest]
        php-versions: ['8.1', '8.2', '8.3', '8.4']
    runs-on: ${{ matrix.operating-system }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: iconv, imagick, gd
          coverage: xdebug

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Check Imagick PHP extension
        run: php -r "echo phpversion('imagick');"

      - name: Check ImageMagick via Imagick
        run: php -r "print_r(Imagick::getVersion());"

      - name: Check ImageMagick CLI
        run: magick --version || true

      # --- Snapshot handling ---
      - name: Clean old snapshots
        run: rm -f test/Integration/__snapshots__/files/*.png

      - name: Generate fresh snapshots
        run: vendor/bin/phpunit || true
        # First run: generates snapshots, may mark tests incomplete

      - name: Run tests against snapshots
        run: vendor/bin/phpunit --coverage-clover clover.xml
        # Second run: validates against the newly generated snapshots

      - name: Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./clover.xml

  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

